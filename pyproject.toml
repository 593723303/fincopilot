[project]
name = "fincopilot"
version = "0.1.0"
description = "财报智能问答与分析服务 — RAG + Agent"
requires-python = ">=3.11"

# 版本约束说明（架构 §13.4 / ADR）：
# 下界为 M0 实测通过的版本，上界卡在下一个大版本之前。
# LangChain 生态迭代极快，一次无意的大版本升级会让此前的评估结果无法复现，
# 因此这里不使用浮动约束。精确版本见 requirements.lock。
dependencies = [
    # 服务
    "fastapi>=0.142,<1.0",
    "uvicorn[standard]>=0.54,<1.0",
    "pydantic>=2.13,<3.0",
    "pydantic-settings>=2.15,<3.0",
    "sse-starlette>=3.5,<4.0",
    "pyyaml>=6.0,<7.0",

    # LLM 应用 —— 已进入 1.x
    "langchain>=1.4,<2.0",
    "langchain-openai>=1.6,<2.0",
    "langchain-core>=1.6,<2.0",
    "langgraph>=1.2,<2.0",

    # 存储 —— pymilvus 3.x 对应 Milvus 3.x 服务端
    "pymilvus>=3.0,<4.0",
    "sqlalchemy[asyncio]>=2.1,<3.0",
    "asyncpg>=0.31,<1.0",
    "alembic>=1.20,<2.0",
    "redis>=8.1,<9.0",

    # 可观测
    "langfuse>=4.16,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10.0",
    "pytest-asyncio>=1.4,<2.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.16,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
