[project]
name = "fincopilot"
version = "0.1.0"
description = "财报智能问答与分析服务 — RAG + Agent"
requires-python = ">=3.11"

# 版本约束说明（架构 §13.4 / ADR）：
# 下界为 M0 实测通过的版本，上界卡在下一个大版本之前。
# LangChain 生态迭代极快，一次无意的大版本升级会让此前的评估结果无法复现，
# 因此这里不使用浮动约束。精确版本见 requirements.lock。
dependencies = [
    # 服务
    "fastapi>=0.142,<1.0",
    "uvicorn[standard]>=0.54,<1.0",
    "pydantic>=2.13,<3.0",
    "pydantic-settings>=2.15,<3.0",
    "sse-starlette>=3.5,<4.0",
    "pyyaml>=6.0,<7.0",
    # FastAPI 的文件上传依赖，不随 fastapi 主包安装
    "python-multipart>=0.0.20,<1.0",

    # LLM 应用 —— 已进入 1.x
    "langchain>=1.4,<2.0",
    "langchain-openai>=1.6,<2.0",
    "langchain-core>=1.6,<2.0",
    # LangChain 1.x 把切分器拆成了独立包，不随 langchain 主包安装
    "langchain-text-splitters>=1.0,<2.0",
    "langgraph>=1.2,<2.0",

    # 存储 —— pymilvus 3.x 对应 Milvus 3.x 服务端
    "pymilvus>=3.0,<4.0",
    "sqlalchemy[asyncio]>=2.1,<3.0",
    "asyncpg>=0.31,<1.0",
    "alembic>=1.20,<2.0",
    # 卡在 5.x：arq 要求 redis<6。本项目只用到 get/set/list/ping 等基础能力，
    # redis-py 8.x 的新特性没有用武之地，降一个大版本的代价远小于换掉 arq。
    "redis[hiredis]>=5.3,<6.0",

    # 文档解析
    "pymupdf>=1.25,<2.0",

    # 离线任务队列：基于 asyncio，与 FastAPI 同一并发模型（§13.2 ④）
    "arq>=0.26,<1.0",

    # 可观测
    "langfuse>=4.16,<5.0",

    # 对话前端。独立进程运行，通过 SSE 调用后端
    "chainlit>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10.0",
    "pytest-asyncio>=1.4,<2.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.16,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py311"
# 迁移脚本由 Alembic autogenerate 产出，不手工调整格式：
# 改了之后下次重新生成又会变回去，徒增 diff 噪声。
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 的依赖注入惯用法就是在默认参数里调用这些函数，
# B008（禁止默认参数中调用函数）在此处是误报。
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
