name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check app tests scripts

      - name: 测试（M0 不依赖外部服务）
        run: pytest -q

  # M3 起启用：评估回归。主指标较主干下降超阈值则 CI 失败（架构 §12.4）
